name: 'AutoCoder Bot'
description: 'Generates code from GitHub issues using ChatGPT and opens a pull request with the generated code for review.'
author: 'AnielloPiscopo'

branding:
  icon: 'code'
  color: 'green'

inputs:
  GITHUB_TOKEN:
    description: 'Personal access token (PAT) used for GitHub API authentication. Required to create pull requests and handle other repository interactions.'
    required: true
  REPOSITORY:
    description: 'The repository where the action will be executed (owner/repo).'
    required: true
  ISSUE_NUMBER:
    description: 'The number of the issue that triggered the action.'
    required: true
  OPENAI_API_KEY:
    description: 'API key for OpenAI, used to generate code from the issue description.'
    required: true
  SCRIPT_PATH:
    description: 'Path to the script that interacts with ChatGPT, relative to the action directory.'
    required: true
    default: 'scripts/script.sh'
  LABEL:
    description: 'The label that triggers the action. Only issues with this label are processed.'
    required: true
    default: 'autocoder-bot'

outputs:
  pull_request_url:
    description: 'The URL of the pull request created with the generated code.'
    value: ${{ steps.create_pr.outputs.pull-request-url }}

runs:
  using: 'composite'
  steps:
    - name: Make script executable
      if: contains(github.event.issue.labels.*.name, inputs.LABEL)
      shell: bash
      run: chmod +x "${{ github.action_path }}/${{ inputs.SCRIPT_PATH }}"

    - name: Generate Code with ChatGPT
      if: contains(github.event.issue.labels.*.name, inputs.LABEL)
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.GITHUB_TOKEN }}
        REPOSITORY: ${{ inputs.REPOSITORY }}
        ISSUE_NUMBER: ${{ inputs.ISSUE_NUMBER }}
        OPENAI_API_KEY: ${{ inputs.OPENAI_API_KEY }}
      run: '"${{ github.action_path }}/${{ inputs.SCRIPT_PATH }}" "$GITHUB_TOKEN" "$REPOSITORY" "$ISSUE_NUMBER" "$OPENAI_API_KEY"'

    - name: Commit generated code
      if: contains(github.event.issue.labels.*.name, inputs.LABEL)
      shell: bash
      run: |
        git config --local user.name "autocoder-bot"
        git config --local user.email "actions@github.com"
        git add autocoder-bot/
        git commit -m "Add code generated for issue #${{ inputs.ISSUE_NUMBER }}"

    - name: Create Pull Request
      id: create_pr
      if: contains(github.event.issue.labels.*.name, inputs.LABEL)
      uses: peter-evans/create-pull-request@v7
      with:
        token: ${{ inputs.GITHUB_TOKEN }}
        author: autocoder-bot <actions@github.com>
        committer: autocoder-bot <actions@github.com>
        branch: autocoder-branch-${{ inputs.ISSUE_NUMBER }}
        base: main
        labels: ${{ inputs.LABEL }}
        title: "AutoCoder: code for issue #${{ inputs.ISSUE_NUMBER }}"
        body: "Code generated automatically from issue #${{ inputs.ISSUE_NUMBER }}."
